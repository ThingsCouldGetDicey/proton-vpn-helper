name: Build and local tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
      - run: npx stylelint source/css/site-router.css source/css/helper-quick.css
      - name: Deterministic site routing tests
        run: |
          TS_NODE_SKIP_PROJECT=1 TS_NODE_COMPILER_OPTIONS='{"module":"Node16","moduleResolution":"Node16","target":"ES2020","rootDir":".","ignoreDeprecations":"6.0"}' npx ts-node tests/site_router.test.ts
      - run: python3 -m unittest discover -s tests -p test_policy_store.py -v
      - run: python3 -m py_compile tests/toolbar_integration.py
      - run: python3 -m py_compile tests/coexistence_browser.py
      - name: Build official-connection-only companion
        run: python3 scripts/build_companion.py
      - name: Inspect companion JavaScript syntax
        run: |
          for file in distribution-companion/js/*.js; do node --check "$file"; done
      - name: Companion policy and migration invariants
        run: node --experimental-default-type=module tests/companion_policy.mjs
      - name: Versioned Proton/Helper bridge contract tests
        run: node --experimental-default-type=module tests/official_bridge.mjs
      - name: Compile headless companion integration tests
        run: python3 -m py_compile scripts/build_companion.py tests/companion_browser.py tests/companion_profile_upgrade.py tests/official_bridge_browser.py
      - run: npm run build
